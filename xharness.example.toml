# Copy this file to xharness.toml and adjust.
# xHarness talks to any OpenAI-compatible endpoint: llama.cpp (llama-server),
# vLLM, Ollama, LiteLLM, or a company gateway.

default_provider = "local"

# "prompt" | "auto" — whether mutating tools (bash, write, edit) ask before running.
approval = "prompt"

max_turns = 40

# Cost brakes: omit the table for unlimited usage.
# [telemetry]
# max_total_tokens = 500000
# max_llm_calls = 100
# cost_per_1k_tokens = 0.0   # optional; adds a cost line to reports

# [subagent]
# max_workers = 4   # parallelism for subagent_batch
# max_turns = 20    # per-child turn limit

# [memory]
# enabled = true
# dir = "/path/to/memory"   # default ~/.xharness/memory
# max_index_chars = 6000
# stale_days = 90             # flag memories not confirmed or used for this long
# expire_days = 0             # archive after this long (0 = off)

# [fleet]
# name = "hub-office"
# [fleet.nodes.farm]
# url = "http://10.0.0.5:3080"
# token_file = "~/.xharness/node-tokens/farm"   # or token_env = "XHARNESS_NODE_FARM_TOKEN"

# project_instructions = true  # read AGENTS.md / CLAUDE.md from cwd into the system prompt

# system_prompt = """
# Your custom system prompt.
# """

[providers.local]
# preset = "llama-cpp"   # or: ollama, vllm, lmstudio, litellm, openai, openrouter, groq, mistral, together
base_url = "http://localhost:8080/v1"
model = "your-model-id"
# api_key_env = "XHARNESS_API_KEY"   # omit for open local endpoints
# temperature = 0.6
# max_tokens = 8192

# Sandbox for the bash tool: sandbox-exec on macOS, bwrap on Linux.
# [sandbox]
# mode = "auto"          # auto (default) | require | off
# allow_network = true   # false also cuts the network inside bash commands

# Optional built-in tools.
# [tools]
# webfetch = false       # true enables the webfetch tool (network egress, approval-gated)
# browser = "http://127.0.0.1:9377"   # local camofox service; adds web_search / browser_open
# browser_approval = true              # false waives approval for those two (the browser is on the node's own machine)

# Telegram channel (starts with `xharness web`): tasks from your phone, approvals as buttons, /api/notify pushes.
# Keep the token in a file (chmod 600), never here; an empty allowed_chats refuses to start.
# [channels.telegram]
# token_file = "~/.xharness/telegram-token"
# allowed_chats = [123456789]

# MCP servers (stdio): their tools join the registry as mcp__{server}__{tool}.
# [mcp.servers.fs]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
# env = { KEY = "value" }
# timeout_seconds = 60

# User plugins: a Python file exposing a module-level `plugin = Plugin(...)`.
# [[plugins]]
# id = "my-tool"
# module = "./plugins/my_tool.py"

# ── Multi-user (a shared machine: a school, a department) ─────────────
# Leave this out and nothing changes: one operator, one shared session store.
# Configure it and everyone signs in, each person gets their own conversations
# and transcript directory, usage and audit records are attributable, and only
# administrators see the fleet-wide report and the security self-check.
# [auth]
# backend = "local"                    # local (accounts here) | ldap (the school's AD/OpenLDAP)
# session_hours = 12
# default_role = "user"
# default_quota_tokens_per_day = 500000     # per person; 0 or unset means no limit
# default_quota_tokens_per_month = 8000000

# Roles and quotas per person. Passwords are never here: use `xharness users add`.
# [auth.users.teacher1]
# display = "Ms Chang"
# quota_tokens_per_day = 1000000
# [auth.users.itadmin]
# role = "admin"

# With the LDAP backend no password material is stored on this machine at all.
# [auth.ldap]
# url = "ldaps://ad.school.edu.tw"     # always ldaps; ldap:// sends the password in the clear
# user_dn = "{user}@school.edu.tw"     # AD uses the UPN; OpenLDAP "uid={user},ou=people,dc=..."
# allow_any = true                     # false restricts access to the names in [auth.users]
# verify_certificate = true            # install your internal CA rather than turning this off
# timeout_seconds = 10

# ── Desktop window ────────────────────────────────────────────────────
# The window binds a random loopback port and needs no token. `node = true`
# opens a second, network-reachable listener on the same instance, so a hub can
# see and steer this machine: usable by the person in front of it, visible to
# the people responsible for it.
# [desktop]
# node = true
# node_port = 3080
# token_file = "~/.xharness/desktop-node-token"   # generated (0600) if absent

# ── User tiers ────────────────────────────────────────────────
# The built-in admin / user tiers are always there; define the ones a site
# actually needs here. Each tier sets a label, whether it administers, which
# tools it never receives, and a default quota.
# [auth.roles.principal]
# label = "Head of school"
# admin = true
#
# [auth.roles.teacher]
# label = "Teacher"
# quota_tokens_per_day = 200000
#
# [auth.roles.student]
# label = "Student"
# quota_tokens_per_day = 30000
# deny_tools = ["bash", "write", "edit", "security_scan", "subagent", "subagent_batch"]
#   Denied tools are absent, not refused: they never appear in the model's tool
#   list, so a restricted account is never promised something that then fails.

# ── Uploaded files ────────────────────────────────────────────
# With [auth] on, each person gets their own working directory
# ($XHARNESS_HOME/workspaces/u/<user>/) and browser uploads land in its
# uploads/ folder, which is where their agent works. Without [auth] the agent
# uses the directory the server was started from, exactly as before.
# [files]
# max_file_mb = 25
# max_total_mb = 500
# retention_days = 0           # 0 keeps uploads until someone deletes them
# allowed_extensions = ["pdf", "docx", "xlsx", "csv", "txt", "md", "png", "jpg"]
#   Omit for the built-in allow-list (documents, data, images, common source
#   files). Executables are never on it.

# Reasoning models need thinking turned off in the request, or the answer lands
# in reasoning_content and content comes back empty.
# [providers.granite]
# base_url = "http://10.0.0.5:8093/v1"
# model = "granite-4.2-30b"
# extra_body = { chat_template_kwargs = { enable_thinking = false } }
