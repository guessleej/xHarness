# 中文註解版範例設定（英文版見 xharness.example.toml）。
# 複製本檔為 xharness.toml 後修改。
# xHarness 可對接任何 OpenAI 相容端點：llama.cpp（llama-server）、
# vLLM、Ollama、LiteLLM 或企業閘道。

default_provider = "local"

# "prompt" | "auto" — 有副作用的工具（bash、write、edit）動手前是否先詢問。
approval = "prompt"

max_turns = 40

# 成本煞車：不寫這個表＝不設限。
# [telemetry]
# max_total_tokens = 500000
# max_llm_calls = 100
# cost_per_1k_tokens = 0.0   # 選填；報表加一行成本

# [subagent]
# max_workers = 4   # subagent_batch 平行上限
# max_turns = 20    # 每個子代理回合上限
# ralph_rounds = 5  # ralph 每次最多幾輪（上限 10）

# [memory]
# enabled = true
# dir = "/path/to/memory"   # 預設 ~/.xharness/memory
# max_index_chars = 6000
# stale_days = 90             # 幾天未確認／未使用就標「待確認」
# expire_days = 0             # 幾天後可歸檔（0 = 關）

# [fleet]
# name = "hub-office"          # 本機在艦隊視圖的名稱
# [fleet.nodes.farm]
# url = "http://10.0.0.5:3080"
# token_file = "~/.xharness/node-tokens/farm"   # 0600 檔案；或 token_env = "XHARNESS_NODE_FARM_TOKEN"

# project_instructions = true  # 自動讀工作目錄的 AGENTS.md / CLAUDE.md 進 system prompt

# system_prompt = """
# 你的自訂系統提示。
# """

[providers.local]
# preset = "llama-cpp"   # 或 ollama、vllm、lmstudio、litellm、openai、openrouter、groq、mistral、together
base_url = "http://localhost:8080/v1"
model = "your-model-id"
# api_key_env = "XHARNESS_API_KEY"   # 開放的本機端點可省略
# temperature = 0.6
# max_tokens = 8192

# bash 工具的沙箱：macOS 用 sandbox-exec、Linux 用 bwrap。
# [sandbox]
# mode = "auto"          # auto（預設）| require（沒有後端就拒絕啟動）| off
# allow_network = true   # false 時 bash 內的指令一併斷網

# 選配內建工具。
# [tools]
# webfetch = false       # true 啟用 webfetch 工具（對外連線，走審批）
# browser = "http://127.0.0.1:9377"   # 地端 camofox 位址；設了就多 web_search／browser_open 兩個工具
# browser_approval = true              # false 讓這兩個工具不走審批（瀏覽器已在節點自己的機器上）
# desktop_control = false              # true 讓模型看這台電腦的畫面、操作滑鼠鍵盤（desktop_look／desktop_act，目前只支援 macOS）
#                                      # 要在「系統設定 > 隱私權與安全性」開「輔助使用」，截圖另需「螢幕錄製」；截圖描述用 [vision] provider
# desktop_approval = true              # 每次看畫面與操作都問人（自動模式也問）；false 改走一般審批策略

# Telegram 通道（隨 `xharness web` 啟動）：手機下任務、按鈕審批、接收 /api/notify 推播。
# 建議改在網頁「管理 > 通知頻道」設定（Telegram、LINE、Teams 都在那裡，金鑰加密保存）；
# 網頁上存了 Telegram 之後，這一段就不再使用。
# token 放檔案（chmod 600），不要寫進這裡；allowed_chats 留空會拒絕啟動。
# [channels.telegram]
# token_file = "~/.xharness/telegram-token"
# allowed_chats = [123456789]

# MCP server（stdio）：其工具以 mcp__{server}__{tool} 名稱進工具清單。
# [mcp.servers.fs]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
# env = { KEY = "value" }
# timeout_seconds = 60

# 使用者插件：一個 Python 檔，模組層級曝露 `plugin = Plugin(...)`。
# [[plugins]]
# id = "my-tool"
# module = "./plugins/my_tool.py"

# ── 多使用者（學校、單位共用同一台機器時使用）─────────────────────
# 不設這一段，行為和以前完全一樣：單一操作者、共用一份 session 記錄。
# 設了之後：每個人要登入、各自有自己的對話與 session 目錄、
# 用量與稽核都歸得到人、管理者才看得到全體報表與資安檢查頁。
# [auth]
# backend = "local"                    # local（本機帳號）| ldap（接學校 AD／OpenLDAP）
# session_hours = 12                   # 登入後多久要重新登入
# default_role = "user"                # 新帳號的預設角色：user | admin
# default_quota_tokens_per_day = 500000    # 每人每日 token 上限（0 或不設＝無限制）
# default_quota_tokens_per_month = 8000000 # 每人每月 token 上限

# 個別使用者的角色與配額（密碼不在這裡，用 xharness users add 建立）。
# [auth.users.teacher1]
# display = "張老師"
# quota_tokens_per_day = 1000000
# [auth.users.itadmin]
# role = "admin"

# 接學校目錄服務時改用這個後端；密碼由目錄驗證，本機不存任何密碼。
# [auth.ldap]
# url = "ldaps://ad.school.edu.tw"     # 一律用 ldaps；ldap:// 會讓密碼裸奔
# user_dn = "{user}@school.edu.tw"     # AD 用 UPN；OpenLDAP 用 "uid={user},ou=people,dc=school,dc=edu,dc=tw"
# allow_any = true                     # false 時只有列在 [auth.users] 的人能用
# verify_certificate = true            # 自建 CA 請把根憑證裝進系統信任區，不要關掉這個
# timeout_seconds = 10

# ── 桌面版 ────────────────────────────────────────────────────
# 桌面視窗預設只綁本機隨機埠，網路上看不到、也不需要權杖。
# node = true 讓同一個視窗額外開一個對外的節點埠，資訊中心的 hub 就能
# 看到這台機器、就地審批或停止——不必在好用與管得住之間二選一。
# [desktop]
# node = true
# node_port = 3080
# token_file = "~/.xharness/desktop-node-token"   # 不存在會自動產生（chmod 600）

# ── 使用者分層 ──────────────────────────────────────────────
# 內建兩層 admin／user 一直都在；下面可以定義學校實際需要的層級。
# 每一層可以設：顯示名稱、是不是管理者、拿不到哪些工具、預設配額。
# [auth.roles.principal]
# label = "校長室"
# admin = true                  # 看得到管理頁與全體用量報告
#
# [auth.roles.itadmin]
# label = "資訊中心"
# admin = true
#
# [auth.roles.teacher]
# label = "教師"
# quota_tokens_per_day = 200000
#
# [auth.roles.student]
# label = "學生"
# quota_tokens_per_day = 30000
# deny_tools = ["bash", "write", "edit", "security_scan", "subagent", "subagent_batch"]
#   ↑ 拿不到的工具是「不存在」不是「被拒絕」：它們根本不會出現在模型的工具清單裡，
#     所以學生問「幫我刪掉這個檔案」時，模型不會先答應再失敗。
# providers = ["granite"]      # 這個層級可以切換的模型（不設＝設定檔裡全部）

# ── 上傳檔案 ────────────────────────────────────────────────
# 啟用 [auth] 後，每個人有自己的工作目錄（$XHARNESS_HOME/workspaces/u/<帳號>/），
# 從瀏覽器上傳的檔案落在它的 uploads/ 底下，agent 就在這個目錄裡工作。
# 沒有啟用 [auth] 時，agent 使用啟動伺服器時的工作目錄，行為與以前相同。
# [files]
# max_file_mb = 25             # 單檔上限
# max_total_mb = 500           # 每個人的總量上限
# retention_days = 0           # 0 = 不自動刪除
# allowed_extensions = ["pdf", "docx", "xlsx", "csv", "txt", "md", "png", "jpg"]
#   ↑ 不設就用內建白名單（文件、資料、圖片、常見程式碼檔）。可執行檔一律不在內。

# reasoning 模型要在請求裡關掉 thinking，否則答案會跑進 reasoning_content、content 留空。
# [providers.granite]
# base_url = "http://192.168.10.70:8093/v1"
# model = "granite-4.2-30b"
# extra_body = { chat_template_kwargs = { enable_thinking = false } }
# context_tokens = 32768      # 端點收得下多少 token（llama-server 的 -c）；設了才會自動壓縮

# ── 技能（Skills） ──────────────────────────────────────────
# 含 SKILL.md 的資料夾（與 Claude Code、Codex 相同格式）。會從工作目錄的
# .xharness/skills 與 .claude/skills、伺服器啟動目錄的 .xharness/skills、
# $XHARNESS_HOME/skills 找。system prompt 只放名稱與一句說明，模型需要時再用 skill 工具載入全文。
# [skills]
# enabled = true
# dirs = ["/srv/shared-skills"]
# claude_home = false          # true 時也讀 ~/.claude/skills

# ── 長對話 ──────────────────────────────────────────────────
# [compaction]
# auto = true                  # prompt 超過 threshold × context_tokens 時，把較早的訊息整理成摘要
# threshold = 0.8
# [sessions]
# auto_title = true            # 第一個任務完成後，由這段對話的模型寫一個短標題
# [web]
# model_switch = true          # 使用者可以切換對話的模型（各層級可用 providers = [...] 限制）

# ── 看圖、背景工作、終端機 ──────────────────────────────────
# 看得懂圖的供應端設 vision = true。純文字模型可以指定一個會看圖的模型，先把圖轉成文字描述。
# [providers.ocr]
# base_url = "http://192.168.10.70:8088/v1"
# model = "gemma-4-e4b-xreadable-ocr"
# vision = true
# [vision]
# provider = "ocr"
# [jobs]
# max_running = 4              # 同時最多幾個背景工作
# max_seconds = 7200           # 單一背景工作最長幾秒
# [tools]
# terminal = true              # 一直開著的 shell

# ── Hooks、語言伺服器 ───────────────────────────────────────
# Claude Code 的 hook 協定。只能在這裡設定：專案本身不能註冊 hook。
# [hooks]
# files = ["~/.claude/settings.json"]   # 有 "hooks" 的 Claude Code 設定檔
# notify = ["/usr/local/bin/notify-turn"]   # 仿 Codex：每個任務結束後呼叫，參數是一段 JSON
# [[hooks.PreToolUse]]
# matcher = "Bash"
# command = "/opt/policy/check-command.sh"
# [lsp]
# auto = true                  # 有安裝 pyright／pylsp／typescript-language-server／gopls／rust-analyzer 就用
# [lsp.servers.java]
# command = ["jdtls"]
# extensions = [".java"]

# ── 自動路由 ───────────────────────────────────────────────
# 每個請求自動挑模型：硬規則（個資與本機檔案不送外部、來源國、帳號分層）→ 能力與成本 → 備援。見 README「自動路由」。
# [routing]
# enabled = true
# default = "local"
# prefer = "cost"                 # cost｜quality
# external_sees = "prompt"        # prompt：外部模型只看你打的字｜all：也看檔案與工具結果
# deny_origins = ["cn"]
# sensitive_words = ["學號"]
# decider = "small"               # 選填：自家機器上的小模型
# health_cooldown_seconds = 120
# [routing.models.local]          # 名稱要對到 [providers.local]
# where = "local"                 # local｜private｜public
# strength = 1                    # 1 簡單｜2 中等｜3 困難
# cost = 0
# origin = "tw"
# [routing.models.cloud]
# strength = 3
# cost = 5
# origin = "us"

# ── 代理角色與討論 ─────────────────────────────────────────
# 角色檔放在 .xharness/agents/名稱.md（也讀 .claude/agents/），格式同 Claude Code 的 subagent。
# [agents]
# enabled = true
# dirs = ["/srv/xharness/agents"]   # 其他放角色檔的目錄
# 讓代理彼此對話：圓桌、辯論、審查、自由（主持人點名）。
# [discussion]
# enabled = true
# max_rounds = 8               # 每場最多幾輪
# max_tokens = 200000          # 每場討論（含主持人）的 token 上限
# speak_turns = 6              # 每次發言最多幾次模型呼叫（含查資料）
# join_minutes = 10            # 跨對話的組對組：等其他對話加入的時限
# turn_minutes = 15            # 等別台代表發言的時限
# [web]
# public_url = "http://192.168.10.70:3080"   # 別台連得到的位址（討論廳邀請碼用）
